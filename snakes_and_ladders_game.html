<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snakes & Ladders - Modern Interactive Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            color: #f8fafc;
            min-height: 100vh;
            user-select: none;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 3D Dice Styling */
        .dice-container {
            perspective: 1000px;
        }

        .dice-cube {
            width: 70px;
            height: 70px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.2, 0.8, 0.3, 1.2);
        }

        .dice-face {
            position: absolute;
            width: 70px;
            height: 70px;
            background: linear-gradient(145deg, #ffffff, #e2e8f0);
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            display: grid;
            grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            padding: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 4px 10px rgba(0,0,0,0.3);
        }

        .dice-pip {
            background-color: #0f172a;
            border-radius: 50%;
            align-self: center;
            justify-self: center;
            width: 11px;
            height: 11px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .dice-face[data-face="1"] .dice-pip { background-color: #ef4444; width: 14px; height: 14px; }

        /* Positioning Dice Faces */
        .face-1 { transform: rotateY(0deg) translateZ(35px); }
        .face-2 { transform: rotateY(90deg) translateZ(35px); }
        .face-3 { transform: rotateX(-90deg) translateZ(35px); }
        .face-4 { transform: rotateX(90deg) translateZ(35px); }
        .face-5 { transform: rotateY(-90deg) translateZ(35px); }
        .face-6 { transform: rotateY(180deg) translateZ(35px); }

        /* Board Tile Grid Layout */
        .board-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 650px;
            position: relative;
        }

        .tile {
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 2px 4px;
            font-weight: 700;
            font-size: 0.75rem;
            transition: all 0.2s ease;
        }

        @media (min-width: 640px) {
            .tile {
                font-size: 0.85rem;
                padding: 4px 6px;
            }
        }

        .tile-even {
            background: rgba(30, 41, 59, 0.85);
        }

        .tile-odd {
            background: rgba(15, 23, 42, 0.85);
        }

        .tile-highlight {
            box-shadow: inset 0 0 12px rgba(234, 179, 8, 0.6);
            background: rgba(234, 179, 8, 0.25) !important;
        }

        /* Player Token Styling */
        .token {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            position: absolute;
            z-index: 25;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
            border: 2px solid white;
        }

        .token-p1 {
            background: linear-gradient(135deg, #ec4899, #be185d);
        }

        .token-p2 {
            background: linear-gradient(135deg, #06b6d4, #0e7490);
        }

        .token-pulse {
            animation: pulse-glow 1.5s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px rgba(255,255,255,0.8)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 12px rgba(255,255,255,1)); }
        }

        /* Custom Scrollbar for Logs */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-2 sm:p-4 min-h-screen">

    <!-- Header Bar -->
    <header class="w-full max-w-6xl glass-panel rounded-2xl p-4 mb-4 flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600/30 p-3 rounded-xl border border-indigo-500/30 text-indigo-400">
                <i class="fa-solid fa-gamepad text-2xl"></i>
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
                    SNAKES & LADDERS
                </h1>

                <button id="mode2PBtn" onclick="setGameMode('2p')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white">
                    <i class="fa-solid fa-users mr-1"></i> 2 Players

            <button id="soundToggleBtn" onclick="toggleSound()" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-300 hover:text-white hover:bg-slate-700/50 transition">

    <!-- Main Game Container -->
    <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6 items-start my-auto">
        
        <!-- Left Dashboard / Controls -->
        <div class="lg:col-span-4 flex flex-col gap-4 order-2 lg:order-1">
            
            <!-- Players Dashboard -->
            <div class="glass-panel rounded-2xl p-4 sm:p-5 flex flex-col gap-3">
                <h2 class="text-xs font-bold text-slate-400 tracking-wider uppercase">Players Dashboard</h2>
                
                <!-- Player 1 Card -->
                <div id="p1Card" class="glass-card rounded-xl p-3.5 flex items-center justify-between border-2 border-pink-500/50 transition-all duration-300">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full token-p1 flex items-center justify-center text-white font-bold shadow-lg">
                            P1
                        </div>
                        <div>
                            <div id="p1Name" class="font-bold text-sm sm:text-base text-pink-300">Player 1</div>
                            <div class="text-xs text-slate-400">Position: <span id="p1Pos" class="font-extrabold text-white text-sm">1</span></div>
                        </div>
                    </div>
                    <div id="p1Badge" class="px-2.5 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-pink-500/20 text-pink-300 border border-pink-500/30">
                        TURN
                    </div>
                </div>

                <!-- Player 2 / AI Card -->
                <div id="p2Card" class="glass-card rounded-xl p-3.5 flex items-center justify-between border-2 border-transparent transition-all duration-300 opacity-60">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full token-p2 flex items-center justify-center text-white font-bold shadow-lg">
                            <i id="p2Icon" class="fa-solid fa-robot"></i>
                        </div>
                        <div>
                            <div id="p2Name" class="font-bold text-sm sm:text-base text-cyan-300">Computer AI</div>
                            <div class="text-xs text-slate-400">Position: <span id="p2Pos" class="font-extrabold text-white text-sm">1</span></div>
                        </div>
                    </div>
                    <div id="p2Badge" class="hidden px-2.5 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
                        WAITING
                    </div>
                </div>
            </div>

            <!-- Interactive Dice & Control Area -->
            <div class="glass-panel rounded-2xl p-5 flex flex-col items-center justify-center gap-4 text-center">
                <div class="text-xs font-bold text-slate-400 tracking-wider uppercase">Dice Roll</div>

                <!-- 3D Animated Dice Container -->
                <div class="dice-container py-2">
                    <div id="diceCube" class="dice-cube">
                        <!-- Face 1 -->
                        <div class="dice-face face-1" data-face="1">
                            <div></div><div></div><div></div><div></div><div class="dice-pip"></div><div></div><div></div><div></div><div></div>
                        </div>
                        <!-- Face 2 -->
                        <div class="dice-face face-2" data-face="2">
                            <div class="dice-pip"></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div class="dice-pip"></div>
                        </div>
                        <!-- Face 3 -->
                        <div class="dice-face face-3" data-face="3">
                            <div class="dice-pip"></div><div></div><div></div><div></div><div class="dice-pip"></div><div></div><div></div><div></div><div class="dice-pip"></div>
                        </div>
                        <!-- Face 4 -->
                        <div class="dice-face face-4" data-face="4">
                            <div class="dice-pip"></div><div></div><div class="dice-pip"></div><div></div><div></div><div></div><div class="dice-pip"></div><div></div><div class="dice-pip"></div>
                        </div>
                        <!-- Face 5 -->
                        <div class="dice-face face-5" data-face="5">
                            <div class="dice-pip"></div><div></div><div class="dice-pip"></div><div></div><div class="dice-pip"></div><div></div><div class="dice-pip"></div><div></div><div class="dice-pip"></div>
                        </div>
                        <!-- Face 6 -->
                        <div class="dice-face face-6" data-face="6">
                            <div class="dice-pip"></div><div></div><div class="dice-pip"></div><div class="dice-pip"></div><div></div><div class="dice-pip"></div><div class="dice-pip"></div><div></div><div class="dice-pip"></div>
                        </div>
                    </div>
                </div>

                <div id="turnStatusText" class="text-sm font-semibold text-slate-300">
                    Player 1's turn to roll!
                </div>

                <button id="rollBtn" onclick="humanRollDice()" class="w-full py-3.5 px-6 rounded-xl font-black text-white text-base tracking-wide bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:from-indigo-600 hover:via-purple-600 hover:to-pink-600 shadow-lg shadow-indigo-500/25 active:scale-95 transition-all duration-150 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-dice text-xl"></i>

            <!-- Game Log Panel -->
            <div class="glass-panel rounded-2xl p-4 flex flex-col h-48">

                    <i class="fa-solid fa-clock-rotate-left text-xs text-slate-500"></i>
                </div>
                <div id="gameLog" class="flex-1 overflow-y-auto custom-scrollbar space-y-2 pr-1 text-xs">
                    <div class="p-2 rounded-lg bg-slate-800/40 text-slate-400 italic">Game started! Roll the dice to move.</div>
                </div>
            </div>

        </div>

        <!-- Right Side: Game Board -->
        <div class="lg:col-span-8 flex justify-center items-center order-1 lg:order-2 w-full">
            <div class="glass-panel rounded-2xl p-2 sm:p-4 w-full flex justify-center items-center relative overflow-hidden">
                
                <!-- Board Grid Container -->
                <div id="boardGrid" class="board-grid rounded-xl overflow-hidden border border-slate-700/80 shadow-2xl">
                    <!-- Tiles injected dynamically by JavaScript -->
                    
                    <!-- SVG Overlay for Snakes and Ladders Graphics -->
                    <svg id="svgOverlay" class="absolute inset-0 w-full h-full pointer-events-none z-10" viewBox="0 0 1000 1000" preserveAspectRatio="none">
                        <defs>
                            <!-- Linear Gradients for Ladders -->
                            <linearGradient id="ladderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#f59e0b" />
                                <stop offset="100%" stop-color="#d97706" />
                            </linearGradient>

                            <!-- Filters for Glowing Shadows -->
                            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                                <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
                            </filter>
                        </defs>
                        <!-- Snakes and Ladders dynamically drawn here -->
                    </svg>

                    <!-- Player Tokens -->
                    <div id="tokenP1" class="token token-p1 token-pulse" style="display: none;">1</div>
                    <div id="tokenP2" class="token token-p2" style="display: none;">2</div>

            </div>

    </main>

    <!-- Winner Celebration Modal -->
    <div id="winnerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass-panel max-w-md w-full rounded-3xl p-6 sm:p-8 text-center flex flex-col items-center gap-5 border border-indigo-500/30 transform scale-90 transition-all duration-300" id="winnerContent">
            <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-amber-400 to-yellow-200 flex items-center justify-center shadow-lg shadow-amber-500/30 text-amber-950 text-4xl animate-bounce">
                <i class="fa-solid fa-trophy"></i>
            </div>
            
            <div>
                <h3 class="text-xs font-black uppercase tracking-widest text-amber-400">VICTORY UNLOCKED</h3>
                <h2 id="winnerTitle" class="text-3xl font-black text-white mt-1">Player 1 Wins!</h2>
                <p id="winnerSubtitle" class="text-xs text-slate-300 mt-2">Reached Tile 100 first through courage and luck!</p>
            </div>

            <div class="w-full flex flex-col gap-2 pt-2">
                <button onclick="resetGame(); hideWinnerModal();" class="w-full py-3.5 rounded-xl font-bold text-white bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 shadow-lg shadow-indigo-500/25 transition">
                    PLAY AGAIN
                </button>
            </div>
        </div>
    </div>

    <script>
        /* --- GAME CONFIGURATION & CONSTANTS --- */
        const BOARD_SIZE = 10;
        const TOTAL_TILES = 100;

        // Defined Snakes (head -> tail)
        const SNAKES = {
            98: 78,
            95: 56,
            92: 51,
            83: 19,
            73: 1,
            69: 33,
            64: 36,
            48: 26,
            34: 6,
            24: 5
        };

        // Defined Ladders (bottom -> top)
        const LADDERS = {
            4: 14,
            9: 31,
            20: 38,
            28: 84,
            36: 44,
            51: 67,
            62: 81,
            71: 91,
            80: 100
        };

        /* Game State */
        let gameMode = 'vs-ai'; // 'vs-ai' or '2p'
        let p1Pos = 1;
        let p2Pos = 1;
        let currentPlayer = 1; // 1 or 2
        let isMoving = false;
        let soundMuted = false;

        /* Web Audio Synthesizer setup */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (soundMuted) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;

            if (type === 'roll') {
                // Short noise roll burst
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'step') {
                // Mild pop sound
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'ladder') {
                // Ascending arpeggio chime
                [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.07);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.2);
                });
            } else if (type === 'snake') {
                // Descending slide whistle sound
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(450, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.4);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'win') {
                // Triumph fan-fare notes
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.12);
                    gain.gain.setValueAtTime(0.3, now + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.12);
                    osc.stop(now + idx * 0.12 + 0.4);
                });
            }
        }

        function toggleSound() {
            soundMuted = !soundMuted;
            const icon = document.getElementById('soundIcon');
            if (soundMuted) {
                icon.className = 'fa-solid fa-volume-xmark text-rose-400';
            } else {
                icon.className = 'fa-solid fa-volume-high';
            }
        }

        // Calculate (col, row) 0-indexed coords for zigzag board pattern
        function getTileCoords(tileNum) {
            const zeroBased = tileNum - 1;
            const rowFromBottom = Math.floor(zeroBased / BOARD_SIZE);
            const col = (rowFromBottom % 2 === 0) 
                ? (zeroBased % BOARD_SIZE) 
                : (BOARD_SIZE - 1 - (zeroBased % BOARD_SIZE));
            const row = (BOARD_SIZE - 1) - rowFromBottom;
            return { col, row };
        }

        // Generate the 10x10 Board DOM Elements
        function createBoard() {
            const boardGrid = document.getElementById('boardGrid');
            
            // Clear existing tiles except SVGs and Tokens
            const tiles = boardGrid.querySelectorAll('.tile');
            tiles.forEach(t => t.remove());

            // Build grid top-to-bottom (row 0 to row 9)
            for (let r = 0; r < BOARD_SIZE; r++) {
                const rowFromBottom = (BOARD_SIZE - 1) - r;
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const tileNum = (rowFromBottom % 2 === 0)
                        ? (rowFromBottom * BOARD_SIZE) + c + 1
                        : (rowFromBottom * BOARD_SIZE) + (BOARD_SIZE - c);

                    const tile = document.createElement('div');
                    tile.id = `tile-${tileNum}`;
                    tile.className = `tile ${(r + c) % 2 === 0 ? 'tile-even' : 'tile-odd'}`;
                    
                    // Style specific start/finish tiles
                    if (tileNum === 100) {
                        tile.classList.add('bg-gradient-to-br', 'from-amber-500/40', 'to-yellow-600/40', 'text-amber-300');
                        tile.innerHTML = `<span>100 <i class="fa-solid fa-trophy text-amber-400 text-[10px]"></i></span>`;
                    } else if (tileNum === 1) {
                        tile.classList.add('bg-gradient-to-br', 'from-emerald-500/40', 'to-teal-600/40', 'text-emerald-300');
                        tile.innerHTML = `<span>1 <i class="fa-solid fa-flag text-emerald-400 text-[10px]"></i></span>`;
                    } else {
                        const isSnakeHead = SNAKES[tileNum];
                        const isLadderBottom = LADDERS[tileNum];
                        
                        let badge = '';
                        if (isSnakeHead) badge = `<span class="text-rose-400 text-[9px] block"><i class="fa-solid fa-staff-snake"></i></span>`;
                        if (isLadderBottom) badge = `<span class="text-amber-400 text-[9px] block"><i class="fa-solid fa-arrow-up text-[8px]"></i></span>`;

                        tile.innerHTML = `
                            <div class="flex flex-col items-start leading-none">
                                <span class="text-slate-300">${tileNum}</span>
                                ${badge}
                            </div>
                        `;
                    }

                    boardGrid.appendChild(tile);
                }
            }
        }

        function drawOverlayElements() {
            const svg = document.getElementById('svgOverlay');
            // Remove existing paths
            svg.querySelectorAll('g').forEach(g => g.remove());

            // Render Ladders
            Object.entries(LADDERS).forEach(([bottomStr, topStr]) => {
                const bottom = parseInt(bottomStr);
                const top = parseInt(topStr);

                const p1 = getTileCenterPercent(bottom);
                const p2 = getTileCenterPercent(top);

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                
                // Main parallel side rails for ladders
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const len = Math.hypot(dx, dy);
                const nx = (-dy / len) * 12; // offset vector
                const ny = (dx / len) * 12;

                // Left rail
                const rail1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                rail1.setAttribute('x1', p1.x + nx); rail1.setAttribute('y1', p1.y + ny);
                rail1.setAttribute('x2', p2.x + nx); rail1.setAttribute('y2', p2.y + ny);
                rail1.setAttribute('stroke', 'url(#ladderGrad)');
                rail1.setAttribute('stroke-width', '5');
                rail1.setAttribute('stroke-linecap', 'round');
                rail1.setAttribute('filter', 'url(#shadow)');

                // Right rail
                const rail2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                rail2.setAttribute('x1', p1.x - nx); rail2.setAttribute('y1', p1.y - ny);
                rail2.setAttribute('x2', p2.x - nx); rail2.setAttribute('y2', p2.y - ny);
                rail2.setAttribute('stroke', 'url(#ladderGrad)');
                rail2.setAttribute('stroke-width', '5');
                rail2.setAttribute('stroke-linecap', 'round');
                rail2.setAttribute('filter', 'url(#shadow)');

                g.appendChild(rail1);
                g.appendChild(rail2);

                // Ladder Rungs
                const rungsCount = Math.floor(len / 35);
                for (let i = 1; i <= rungsCount; i++) {
                    const t = i / (rungsCount + 1);
                    const rx = p1.x + dx * t;
                    const ry = p1.y + dy * t;

                    const rung = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    rung.setAttribute('x1', rx + nx); rung.setAttribute('y1', ry + ny);
                    rung.setAttribute('x2', rx - nx); rung.setAttribute('y2', ry - ny);
                    rung.setAttribute('stroke', '#fbbf24');
                    rung.setAttribute('stroke-width', '3');
                    rung.setAttribute('stroke-linecap', 'round');
                    g.appendChild(rung);
                }

                svg.appendChild(g);
            });

            // Render Snakes
            Object.entries(SNAKES).forEach(([headStr, tailStr]) => {
                const head = parseInt(headStr);
                const tail = parseInt(tailStr);

                const pHead = getTileCenterPercent(head);
                const pTail = getTileCenterPercent(tail);

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');

                // Curved Snake Body Path
                const dx = pTail.x - pHead.x;
                const dy = pTail.y - pHead.y;
                const cx1 = pHead.x + dx * 0.25 + (dy * 0.3);
                const cy1 = pHead.y + dy * 0.25 - (dx * 0.3);
                const cx2 = pHead.x + dx * 0.75 - (dy * 0.3);
                const cy2 = pHead.y + dy * 0.75 + (dx * 0.3);

                const d = `M ${pHead.x} ${pHead.y} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${pTail.x} ${pTail.y}`;

                // Outer Snake Body
                const body = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                body.setAttribute('d', d);
                body.setAttribute('fill', 'none');
                body.setAttribute('stroke', '#f43f5e');
                body.setAttribute('stroke-width', '10');
                body.setAttribute('stroke-linecap', 'round');
                body.setAttribute('filter', 'url(#shadow)');

                // Inner Pattern
                const pattern = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pattern.setAttribute('d', d);
                pattern.setAttribute('fill', 'none');
                pattern.setAttribute('stroke', '#fda4af');
                pattern.setAttribute('stroke-width', '4');
                pattern.setAttribute('stroke-dasharray', '8 6');

                // Head Circle
                const headCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                headCircle.setAttribute('cx', pHead.x);
                headCircle.setAttribute('cy', pHead.y);
                headCircle.setAttribute('r', '8');
                headCircle.setAttribute('fill', '#e11d48');

                g.appendChild(body);
                g.appendChild(pattern);
                g.appendChild(headCircle);

                svg.appendChild(g);
            });
        }

        function getTileCenterPercent(tileNum) {
            const { col, row } = getTileCoords(tileNum);
            return {
                x: (col + 0.5) * 100, // 0-1000 viewBox units
                y: (row + 0.5) * 100
            };
        }

        function updateTokenPositions(animate = true) {
            const p1Token = document.getElementById('tokenP1');
            const p2Token = document.getElementById('tokenP2');

            p1Token.style.display = 'flex';
            p2Token.style.display = 'flex';

            const p1Coords = getTileCoords(p1Pos);
            const p2Coords = getTileCoords(p2Pos);

            // Apply slight offset if players are on the exact same tile
            const sameTile = p1Pos === p2Pos;

            const p1Left = (p1Coords.col * 10) + (sameTile ? 2 : 3.5);
            const p1Top = (p1Coords.row * 10) + (sameTile ? 2 : 3.5);

            const p2Left = (p2Coords.col * 10) + (sameTile ? 5.5 : 3.5);
            const p2Top = (p2Coords.row * 10) + (sameTile ? 5.5 : 3.5);

            p1Token.style.left = `${p1Left}%`;
            p1Token.style.top = `${p1Top}%`;

            p2Token.style.left = `${p2Left}%`;
            p2Token.style.top = `${p2Top}%`;

            document.getElementById('p1Pos').innerText = p1Pos;
            document.getElementById('p2Pos').innerText = p2Pos;
        }

        function humanRollDice() {
            if (isMoving) return;
            if (gameMode === 'vs-ai' && currentPlayer === 2) return;

            executeTurn();
        }

        function executeTurn() {
            isMoving = true;
            document.getElementById('rollBtn').disabled = true;

            // Trigger dice rotation animation & audio
            playSound('roll');
            const diceCube = document.getElementById('diceCube');
            
            const diceRoll = Math.floor(Math.random() * 6) + 1;

            // Rotation vectors for dice faces
            const rotations = {
                1: { x: 0, y: 0 },
                2: { x: 0, y: -90 },
                3: { x: 90, y: 0 },
                4: { x: -90, y: 0 },
                5: { x: 0, y: 90 },
                6: { x: 0, y: 180 }
            };

            const rot = rotations[diceRoll];
            const extraSpinsX = (Math.floor(Math.random() * 3) + 2) * 360;
            const extraSpinsY = (Math.floor(Math.random() * 3) + 2) * 360;

            diceCube.style.transform = `rotateX(${rot.x + extraSpinsX}deg) rotateY(${rot.y + extraSpinsY}deg)`;

            setTimeout(() => {
                logMessage(`Player ${currentPlayer} rolled a <span class="font-bold text-amber-400">${diceRoll}</span>!`);
                movePlayerStepByStep(currentPlayer, diceRoll);
            }, 1000);
        }

        async function movePlayerStepByStep(player, steps) {
            let startPos = player === 1 ? p1Pos : p2Pos;
            let targetPos = startPos + steps;

            // Must reach tile 100 with exact roll rule
            if (targetPos > TOTAL_TILES) {
                logMessage(`Player ${player} needs exact roll to reach 100! Turn skipped.`);
                finishTurn();
                return;
            }

            // Step-by-step token movement loop
            for (let i = 0; i < steps; i++) {
                if (player === 1) p1Pos++;
                else p2Pos++;

                updateTokenPositions();
                playSound('step');
                await highlightTileTemporarily(player === 1 ? p1Pos : p2Pos);
                await delay(250);
            }

            let currentTile = player === 1 ? p1Pos : p2Pos;

            // Check Snake
            if (SNAKES[currentTile]) {
                const destination = SNAKES[currentTile];
                playSound('snake');
                logMessage(` Oh no! Player ${player} swallowed by Snake at ${currentTile}! Sliding down to ${destination}.`);
                await delay(400);

                if (player === 1) p1Pos = destination;
                else p2Pos = destination;

                updateTokenPositions();
                await delay(300);
            }
            // Check Ladder
            else if (LADDERS[currentTile]) {
                const destination = LADDERS[currentTile];
                playSound('ladder');
                logMessage(` Awesome! Player ${player} found a Ladder at ${currentTile}! Climbing up to ${destination}.`);
                await delay(400);

                if (player === 1) p1Pos = destination;
                else p2Pos = destination;

                updateTokenPositions();
                await delay(300);
            }

            // Check Win Condition
            const finalPos = player === 1 ? p1Pos : p2Pos;
            if (finalPos === TOTAL_TILES) {
                playSound('win');
                triggerVictory(player);
                return;
            }

            finishTurn();
        }

        function highlightTileTemporarily(tileNum) {
            return new Promise(resolve => {
                const tile = document.getElementById(`tile-${tileNum}`);
                if (tile) tile.classList.add('tile-highlight');
                setTimeout(() => {
                    if (tile) tile.classList.remove('tile-highlight');
                    resolve();
                }, 200);
            });
        }

        function finishTurn() {
            // Switch current active player
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updateUIForCurrentTurn();

            isMoving = false;
            document.getElementById('rollBtn').disabled = false;

            // Trigger AI automatically if in VS Computer mode
            if (gameMode === 'vs-ai' && currentPlayer === 2) {
                document.getElementById('rollBtn').disabled = true;
                setTimeout(() => {
                    executeTurn();
                }, 1000);
            }
        }

        function updateUIForCurrentTurn() {
            const p1Card = document.getElementById('p1Card');
            const p2Card = document.getElementById('p2Card');
            const p1Badge = document.getElementById('p1Badge');
            const p2Badge = document.getElementById('p2Badge');
            const turnText = document.getElementById('turnStatusText');
            const p1Token = document.getElementById('tokenP1');
            const p2Token = document.getElementById('tokenP2');

            if (currentPlayer === 1) {
                p1Card.classList.remove('opacity-60', 'border-transparent');
                p1Card.classList.add('border-pink-500/50');
                p1Badge.classList.remove('hidden');

                p2Card.classList.add('opacity-60', 'border-transparent');
                p2Card.classList.remove('border-cyan-500/50');
                p2Badge.classList.add('hidden');

                p1Token.classList.add('token-pulse');
                p2Token.classList.remove('token-pulse');

                turnText.innerText = "Player 1's turn to roll!";
            } else {
                p2Card.classList.remove('opacity-60', 'border-transparent');
                p2Card.classList.add('border-cyan-500/50');
                p2Badge.classList.remove('hidden');

                p1Card.classList.add('opacity-60', 'border-transparent');
                p1Card.classList.remove('border-pink-500/50');
                p1Badge.classList.add('hidden');

                p2Token.classList.add('token-pulse');
                p1Token.classList.remove('token-pulse');

                if (gameMode === 'vs-ai') {
                    turnText.innerText = "Computer AI is thinking...";
                } else {
                    turnText.innerText = "Player 2's turn to roll!";
                }
            }
        }

        function setGameMode(mode) {
            if (isMoving) return;
            gameMode = mode;

            const vsAiBtn = document.getElementById('modeVsAiBtn');
            const p2Btn = document.getElementById('mode2PBtn');
            const p2Name = document.getElementById('p2Name');
            const p2Icon = document.getElementById('p2Icon');

            if (mode === 'vs-ai') {
                vsAiBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow-md";
                p2Btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
                p2Name.innerText = "Computer AI";
                p2Icon.className = "fa-solid fa-robot";
            } else {
                p2Btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-indigo-600 text-white shadow-md";
                vsAiBtn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
                p2Name.innerText = "Player 2";
                p2Icon.className = "fa-solid fa-user";
            }

            resetGame();
        }

        function logMessage(msg) {
            const logContainer = document.getElementById('gameLog');
            const entry = document.createElement('div');
            entry.className = 'p-2 rounded-lg bg-slate-800/60 border border-slate-700/50 text-slate-200 animate-fade-in flex items-center justify-between';
            entry.innerHTML = `<span>${msg}</span> <span class="text-[10px] text-slate-500">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</span>`;
            
            logContainer.prepend(entry);
        }

        function triggerVictory(player) {
            const winnerTitle = document.getElementById('winnerTitle');
            const winnerSubtitle = document.getElementById('winnerSubtitle');
            
            const winnerName = (player === 1) ? 'Player 1' : (gameMode === 'vs-ai' ? 'Computer AI' : 'Player 2');
            winnerTitle.innerText = `${winnerName} Wins!`;
            winnerSubtitle.innerText = `Outmaneuvered all snakes to reach tile 100!`;

            // Trigger Fireworks / Confetti
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }

            const modal = document.getElementById('winnerModal');
            const modalContent = document.getElementById('winnerContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-90');
            modalContent.classList.add('scale-100');
        }

        function hideWinnerModal() {
            const modal = document.getElementById('winnerModal');
            const modalContent = document.getElementById('winnerContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-90');
        }

        function resetGame() {
            p1Pos = 1;
            p2Pos = 1;
            currentPlayer = 1;
            isMoving = false;
            document.getElementById('rollBtn').disabled = false;
            
            document.getElementById('gameLog').innerHTML = `
                <div class="p-2 rounded-lg bg-slate-800/40 text-slate-400 italic">Game restarted! Roll the dice to move.</div>
            `;

            updateTokenPositions(false);
            updateUIForCurrentTurn();
        }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        window.onload = function() {
            createBoard();
            drawOverlayElements();
            resetGame();

            // Handle window resize to realign SVG board overlays
            window.addEventListener('resize', () => {
                drawOverlayElements();
                updateTokenPositions(false);
            });
        };
    </script>
</body>
</html>
